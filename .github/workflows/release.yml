name: 'Release'

# 推送 v* 格式的 tag 时自动触发打包发布。
# 支持 macOS / Windows / Linux 三平台并行构建，并生成 updater 签名产物。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      # 单平台失败不取消其他平台（最大化构建成功率）。
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles app,dmg'
            rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
            rust_target: ''
          - platform: 'windows-latest'
            args: '--bundles nsis'
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    concurrency:
      group: release-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "TAURI_BUNDLER_DMG_IGNORE_CI=true" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing secret
        shell: bash
        run: |
          secret='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          secret="$(printf '%s' "$secret" | tr -d '\r\n\t ')"

          if [ -z "$secret" ]; then
            echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY"
            echo "::error::Go to Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi

          if [[ "$secret" != dW50cnVzdGVkIGNvbW1lbnQ6* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not look like a Tauri updater private key file content"
            echo "::error::Paste the full content of .local/signing/tauri-updater-private.key into the repository secret"
            exit 1
          fi

          SECRET_TO_VALIDATE="$secret" python - <<'PY'
          import base64
          import os
          import sys

          secret = os.environ["SECRET_TO_VALIDATE"]
          try:
              decoded = base64.b64decode(secret, validate=True).decode("utf-8", errors="strict")
          except Exception as exc:
              print(f"::error::TAURI_SIGNING_PRIVATE_KEY is not valid base64: {exc}")
              sys.exit(1)

          if not decoded.startswith("untrusted comment:"):
              print("::error::Decoded updater key does not start with the expected Tauri key header")
              sys.exit(1)
          PY

          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
            echo "$secret"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZCodePet ${{ github.ref_name }}'
          releaseBody: |
            ## ZCodePet ${{ github.ref_name }}

            ### 下载

            - **macOS**: 使用 `.dmg` 安装（通用版，支持 Apple Silicon 和 Intel）。
            - **Windows**: 使用 `-setup.exe` 安装程序。
            - **Linux**: 使用 `.deb` 或 `.AppImage`。

            ### 系统要求

            - macOS 10.13+
            - Windows 10+
            - Ubuntu 20.04+ / Debian 11+（需 `libwebkit2gtk-4.1-0`）

            ### 应用内更新

            已安装旧版本的用户，启动应用后会在顶部看到「下载更新」按钮，点击即可下载安装并自动重启。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
